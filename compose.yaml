name: lead-hunter-api
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile.api
  env_file: .env
  environment: &environment
    LH_DATABASE_URL: postgresql+psycopg://leadhunter:${POSTGRES_PASSWORD:?Generate .env first}@postgres:5432/leadhunter
    LH_REDIS_URL: redis://:${REDIS_PASSWORD:?Generate .env first}@redis:6379/0
    LH_QUEUE_MODE: celery
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: leadhunter
      POSTGRES_DB: leadhunter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U leadhunter -d leadhunter']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate .env first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *api
    ports: ['127.0.0.1:8001:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *api
    command: [celery, -A, 'tiktok_api.worker:celery', worker, '--loglevel=INFO', '--concurrency=2']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  beat:
    <<: *api
    command: [celery, -A, 'tiktok_api.worker:celery', beat, '--loglevel=INFO', '--schedule=/tmp/celerybeat-schedule']
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  https:
    image: caddy:2-alpine
    profiles: [https]
    ports: ['127.0.0.1:8443:443']
    volumes: ['./deploy/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy-data:/data', 'caddy-config:/config']
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
